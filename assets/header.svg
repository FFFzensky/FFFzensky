<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#1a000a"/>
      <stop offset="1" stop-color="#5c001d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d1245b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#d1245b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9a3b1"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="340" y1="0" x2="572" y2="0">
      <stop offset="0" stop-color="#d1245b" stop-opacity="0"/>
      <stop offset="1" stop-color="#d1245b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ruleR" gradientUnits="userSpaceOnUse" x1="628" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#d1245b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d1245b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .tw  { animation: tw 3.2s ease-in-out infinite; }
      .tw2 { animation: tw 4.4s ease-in-out infinite 1.1s; }
      .tw3 { animation: tw 5.1s ease-in-out infinite 2.3s; }
      .pulse { animation: pulse 6s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .95 } }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect class="pulse" width="1200" height="280" rx="14" fill="url(#glow)"/>

  <!-- double frame -->
  <rect x="14" y="14" width="1172" height="252" rx="10" fill="none" stroke="#d1245b" stroke-opacity="0.40"/>
  <rect x="22" y="22" width="1156" height="236" rx="7" fill="none" stroke="#d1245b" stroke-opacity="0.15"/>

  <!-- corner flourishes -->
  <g stroke="#d1245b" stroke-opacity="0.55" stroke-width="1.4" fill="none">
    <path d="M30 60 V30 H60"/><path d="M1170 60 V30 H1140"/>
    <path d="M30 220 V250 H60"/><path d="M1170 220 V250 H1140"/>
  </g>

  <!-- masquerade mask (left) -->
  <g transform="translate(160 140) rotate(-12)" opacity="0.55">
    <path fill="#d1245b" fill-rule="evenodd"
          d="M-62,-4 C-57,-27 -26,-31 0,-13 C26,-31 57,-27 62,-4 C57,17 31,24 0,9 C-31,24 -57,17 -62,-4 Z
             M-41,-4 a15,8 0 1,0 30,0 a15,8 0 1,0 -30,0 Z
             M11,-4 a15,8 0 1,0 30,0 a15,8 0 1,0 -30,0 Z"/>
    <path d="M-62,-4 C-80,4 -88,24 -78,44" stroke="#d1245b" stroke-width="2" fill="none"/>
    <path d="M62,-4 C80,4 88,24 78,44" stroke="#d1245b" stroke-width="2" fill="none"/>
  </g>

  <!-- dice (right): the die is cast -->
  <g opacity="0.6">
    <g transform="translate(1020 118) rotate(18)">
      <rect x="-26" y="-26" width="52" height="52" rx="9" fill="none" stroke="#d1245b" stroke-width="2"/>
      <g fill="#d1245b"><circle cx="-12" cy="-12" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="12" cy="12" r="4"/></g>
    </g>
    <g transform="translate(1078 168) rotate(-14)">
      <rect x="-20" y="-20" width="40" height="40" rx="7" fill="none" stroke="#d1245b" stroke-width="1.8"/>
      <g fill="#d1245b"><circle cx="-9" cy="-9" r="3.2"/><circle cx="9" cy="-9" r="3.2"/><circle cx="-9" cy="9" r="3.2"/><circle cx="9" cy="9" r="3.2"/></g>
    </g>
  </g>

  <!-- stars -->
  <g fill="#f2d7e0">
    <circle class="tw"  cx="90"   cy="58"  r="2"/>
    <circle class="tw2" cx="270"  cy="44"  r="1.4"/>
    <circle class="tw3" cx="330"  cy="228" r="1.6"/>
    <circle class="tw"  cx="890"  cy="50"  r="1.6"/>
    <circle class="tw2" cx="930"  cy="230" r="1.3"/>
    <circle class="tw3" cx="1120" cy="66"  r="2"/>
    <circle class="tw2" cx="60"   cy="200" r="1.3"/>
    <path class="tw3" d="M250 196 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
    <path class="tw"  d="M960 92 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z"/>
  </g>

  <!-- title block -->
  <text x="600" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66"
        letter-spacing="11" fill="url(#title)">FIERLANSYAH</text>
  <text x="600" y="156" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18"
        letter-spacing="3" fill="#c9a3b1">ANDROID &amp; WEB DEVELOPER  ·  YOGYAKARTA, INDONESIA</text>

  <!-- ornament rule -->
  <path d="M340 190 H572" stroke="url(#rule)" stroke-width="2"/>
  <path d="M628 190 H860" stroke="url(#ruleR)" stroke-width="2"/>
  <path class="pulse" d="M600 178 l12 12 -12 12 -12 -12 z" fill="#d1245b"/>
  <path d="M600 184 l6 6 -6 6 -6 -6 z" fill="#ffe4ec"/>

  <text x="600" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18"
        letter-spacing="5" fill="#d1245b">ALEA IACTA EST  —  THE DIE IS CAST</text>
</svg>
