    <circle cx="1120" cy="190" r="1.5"/><circle cx="240" cy="40" r="1.2"/><circle cx="980" cy="225" r="1.2"/>
  </g>

  <text x="600" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64"
